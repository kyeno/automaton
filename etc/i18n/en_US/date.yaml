# Date/Time i18n bundle -- owned by src/lib/date.js
# ---------------------------------------------------------------------------
# Localized vocabulary for date and time phrases. System file (force-tracked in
# git, no .dist), loaded by the date helper and exposed to automations.
# day_names / month_names are indexed by Date.getDay() (0 = Sunday) and
# Date.getMonth() (0 = January). English has no declension: plain month names,
# empty year_word.

# Day-of-week names, indexed by getDay().
day_names:
  - 'Sunday'         # 0
  - 'Monday'         # 1
  - 'Tuesday'        # 2
  - 'Wednesday'      # 3
  - 'Thursday'       # 4
  - 'Friday'         # 5
  - 'Saturday'       # 6

# Month names, indexed by getMonth().
month_names:
  - 'January'        # 0
  - 'February'       # 1
  - 'March'          # 2
  - 'April'          # 3
  - 'May'            # 4
  - 'June'           # 5
  - 'July'           # 6
  - 'August'         # 7
  - 'September'      # 8
  - 'October'        # 9
  - 'November'       # 10
  - 'December'       # 11

# The "year" word -- empty in English.
year_word: ''

# Date fragment -- no "It is", no trailing period. Used via the {% date %} token.
date_sentence: '{% day_name %}, {% month_name %} {% day %}, {% year %}'

# Localized day-period words for {% time_of_day %}.
period_words:
  morning: 'in the morning'
  noon: 'at noon'
  afternoon: 'in the afternoon'
  evening: 'in the evening'
  night: 'at night'

# Localized unit words for {% next_interval %}.
duration_units:
  day: 'days'
  hour: 'hours'
  minute: 'minutes'
  second: 'seconds'
