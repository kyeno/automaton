# Date/Time i18n bundle -- owned by src/lib/date.js
# ---------------------------------------------------------------------------
# Localized vocabulary for date and time phrases. System file (force-tracked in
# git, no .dist), loaded by the date helper and exposed to automations.
# Polish declension: month_names are genitive ("1 września 2026 roku"), day_names
# nominative ("wtorek"), year_word is the genitive of "rok".
# day_names / month_names are indexed by Date.getDay() (0 = Sunday) and
# Date.getMonth() (0 = January).

# Day-of-week names (nominative), indexed by getDay().
day_names:
  - 'niedziela'      # 0 Sunday
  - 'poniedziałek'   # 1 Monday
  - 'wtorek'         # 2 Tuesday
  - 'środa'          # 3 Wednesday
  - 'czwartek'       # 4 Thursday
  - 'piątek'         # 5 Friday
  - 'sobota'         # 6 Saturday

# Month names (GENITIVE), indexed by getMonth().
month_names:
  - 'stycznia'       # 0 January
  - 'lutego'         # 1 February
  - 'marca'          # 2 March
  - 'kwietnia'       # 3 April
  - 'maja'           # 4 May
  - 'czerwca'        # 5 June
  - 'lipca'          # 6 July
  - 'sierpnia'       # 7 August
  - 'września'       # 8 September
  - 'października'   # 9 October
  - 'listopada'      # 10 November
  - 'grudnia'        # 11 December

# The "year" word (genitive), appended after the year number.
year_word: 'roku'

# Date fragment -- no "Jest", no trailing period. Used via the {% date %} token.
date_sentence: '{% day_name %}, {% day %} {% month_name %} {% year %} {% year_word %}'

# Localized day-period words for {% time_of_day %}.
period_words:
  morning: 'rano'
  noon: 'w południe'
  afternoon: 'po południu'
  evening: 'wieczorem'
  night: 'w nocy'

# Localized unit words for {% next_interval %}; the model inflects them to fit the number.
duration_units:
  day: 'dni'
  hour: 'godzin'
  minute: 'minut'
  second: 'sekund'
