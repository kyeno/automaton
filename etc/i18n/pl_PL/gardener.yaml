# Gardener -- Polish Language Bundle
# ----------------------------------
# Speech templates for the ttsGardener automation (plant hydration reports).
# Each section holds per-output-path lines like the greeter bundle:
#   <bucket>.tts -- spoken verbatim when use_ai is off / AI unavailable
#   <bucket>.ai  -- instruction sent to the model; it speaks its own report
# Placeholders (filled at run time from live sensor state):
#   {% affected_flowers %} -- every plant below the healthy band as "Name (NN)", driest first
#   {% driest_flower %}    -- name of the single driest plant
#   {% driest_moisture %}  -- that plant's raw moisture value (digits only)
# Keep numeric values out of the template words where possible so Piper TTS and small
# models read digits naturally in any locale; unit words stay in the sentences themselves.

critical:
  tts: 'Uwaga! Wilgotność podłoża spadła do niebezpiecznych wartości: {% affected_flowers %}. Najbardziej przesuszone jest {% driest_flower %}, z odczytem tylko {% driest_moisture %}. Podlej je natychmiast!'
  ai: 'Ogłoś pilnie, że te rośliny są na skraju całkowitego wyschnięcia: {% affected_flowers %}. Najgroźniejszy przypadek to {% driest_flower %} z odczytem {% driest_moisture %}. Wezwij do natychmiastowego podlania.'

dry:
  tts: 'Twój ogród potrzebuje uwagi: {% affected_flowers %}. Wilgotność spada -- zacznij podlewać od {% driest_flower %}.'
  ai: 'Poinformuj, że te rośliny zaczynają się suszyć: {% affected_flowers %}. Zacznij od {% driest_flower %}, które ma teraz {% driest_moisture %}. Zaproponuj wczesne podlanie.'

slightly_dry:
  tts: 'Hej, wilgotność podłoża zaczyna spadać: {% affected_flowers %}. Nic jeszcze pilnego, ale warto mieć je na oku.'
  ai: 'Wspomnij mimochodem, że te rośliny zaczynają tracić wilgoć: {% affected_flowers %}. Bez paniki, ale lepiej sprawdzić zanim będzie gorzej.'

healthy:
  tts: 'Wszystkie Twoje rośliny są dobrze nawodnione. Wilgotność podłoża wygląda świetnie -- nic nie wymaga podlania.'
  ai: 'Ogłoś krótko i z przyjemnością, że wszystkie rośliny w ogrodzie mają odpowiednią wilgotność i dziś nikt nie potrzebuje wody.'
